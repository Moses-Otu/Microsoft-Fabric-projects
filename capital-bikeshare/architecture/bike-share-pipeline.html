<title>Bike Share Data Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one wide flow diagram (sources → Fabric → your computer → Claude), then the run order and where governance applies */
:root {
  --bg: #f6f7f5; --panel: #ffffff; --ink: #1d2422; --muted: #5d6763; --line: #cfd6d2;
  --fabric: #0f766e; --fabric-tint: #e3f1ef; --claude: #b45309; --claude-tint: #f8ecdf; --pc-tint: #eceff4;
  --gold: #8a6a12; --tenant: #3b5bab; --tenant-tint: #e6ebf7;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121615; --panel: #1a201e; --ink: #e6ebe8; --muted: #9aa5a0; --line: #34403c;
  --fabric: #4fc3b6; --fabric-tint: #16302d; --claude: #f0a35a; --claude-tint: #33261a; --pc-tint: #1f252d; --gold: #e3c35e; --tenant: #8fa8ec; --tenant-tint: #1e2640; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121615; --panel: #1a201e; --ink: #e6ebe8; --muted: #9aa5a0; --line: #34403c;
  --fabric: #4fc3b6; --fabric-tint: #16302d; --claude: #f0a35a; --claude-tint: #33261a; --pc-tint: #1f252d; --gold: #e3c35e; --tenant: #8fa8ec; --tenant-tint: #1e2640; color-scheme: dark }

body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 1320px; margin: 0 auto; padding-inline: 20px; padding-block: 36px 56px; display: flex; flex-direction: column; gap: 32px; }
header { display: flex; flex-direction: column; gap: 8px; max-width: 64ch; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--fabric); }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(28px, 4vw, 40px); line-height: 1.1; margin: 0; text-wrap: balance; }
header p { margin: 0; color: var(--muted); }
figure { margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
.scroll { overflow-x: auto; }
svg.arch { display: block; width: 100%; min-width: 980px; height: auto; color: var(--ink); font-family: var(--body); }
figcaption { font-size: 13px; color: var(--muted); margin-top: 10px; max-width: 90ch; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); gap: 28px; }
.cols > section { min-width: 0; }
h2 { font-family: var(--display); font-weight: 500; font-size: 20px; margin: 0 0 12px; }
ol.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
ol.steps li { display: grid; grid-template-columns: 2.4rem 1fr; gap: 10px; align-items: start; }
.num { font-family: var(--mono); font-size: 12px; font-weight: 500; border-radius: 999px; height: 1.8rem; display: grid; place-items: center; border: 1.5px solid currentColor; }
.num.f { color: var(--fabric); } .num.y { color: var(--muted); } .num.c { color: var(--claude); }
ol.steps b { font-weight: 600; }
ol.steps p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
code { font-family: var(--mono); font-size: .88em; }
ul.gov { margin: 0; padding-left: 1.1rem; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
ul.gov li::marker { color: var(--fabric); }
.note { font-size: 14px; color: var(--muted); border-left: 3px solid var(--claude); padding-left: 12px; margin: 16px 0 0; }
</style>

<div class="wrap">
  <header>
    <span class="eyebrow">Capital Bikeshare · 2011–2012</span>
    <h1>From raw trip files to a live, governed dashboard</h1>
    <p>Fabric imports, cleans and models the data. Your Microsoft tenant's Power BI MCP server answers the dashboard's queries live, as each signed-in viewer, so the model's security applies inside Claude.</p>
  </header>

    <figcaption>The dashboard sends DAX through Claude's custom connector to the Power BI MCP server, which queries the certified semantic model as the person viewing. Entra ID handles the sign-in, and the tenant setting switches the server on. Nothing is copied out of Fabric, so every viewer sees current numbers limited by their own row- and object-level security.</figcaption>
